<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <a class="search-hit" href="{url}">
    <span class="search-hit-title">{title}</span>
    <span class="search-hit-snippet">{snippet}</span>
    <span class="search-hit-meta">{date}{categories}{tags}</span>
  </a>
{% endcapture %}

{% capture not_found %}<p class="search-empty">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'date') {
          const date = new Date(value.slice(0, 10));
          if (isNaN(date)) {
            return '';
          }
          return `<span>${date.toLocaleDateString('{{ site.lang }}', { year: 'numeric', month: 'short', day: 'numeric' })}</span>`;
        }

        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<span><i class="far fa-folder fa-fw"></i>${value}</span>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<span><i class="fas fa-hashtag fa-fw"></i>${value}</span>`;
          }
        }
      }
    });
  });
</script>
